name = "cellixme"
main = "worker.js"
compatibility_date = "2026-10-01"

[assets]
# All project files are kept in the repository root as requested.
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "cellix-me-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
APP_NAME = "Cellix Me"
